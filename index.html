
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Species Recognition</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    header {
      background: #12372a;
      color: white;
      text-align: center;
      padding: 28px 16px;
    }
    header h1 { margin: 0 0 10px; }
    header p { margin: 0; color: #d1fae5; }
    main {
      max-width: 700px;
      margin: 35px auto;
      padding: 0 16px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 8px 30px #0f172a12;
    }
    .upload {
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      padding: 28px 15px;
      text-align: center;
    }
    input { max-width: 100%; margin-top: 14px; }
    #preview {
      display: none;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      margin-top: 20px;
      border-radius: 12px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #166534;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #result {
      display: none;
      margin-top: 22px;
      padding: 18px;
      background: #ecfdf5;
      border-radius: 12px;
      line-height: 1.8;
    }
    footer { text-align: center; color: #64748b; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>Animal Species Recognition</h1>
    <p>AI-powered animal image classification</p>
  </header>

  <main>
    <section class="card">
      <h2>Identify an Animal</h2>
      <p>Upload an image of a cat, dog, elephant, horse, or lion.</p>

      <div class="upload">
        <strong>Choose an animal image</strong><br>
        <input type="file" id="imageInput" accept="image/*">
        <img id="preview" alt="Selected animal preview">
      </div>

      <button id="predictButton" disabled>Predict Animal</button>
      <div id="result" role="status"></div>
    </section>
  </main>

  <footer>Animal Species Recognition Project</footer>

  <script>
    const input = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const button = document.getElementById("predictButton");

    input.addEventListener("change", () => {
      const file = input.files[0];
      if (!file) {
        preview.style.display = "none";
        button.disabled = true;
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      button.disabled = false;
      document.getElementById("result").style.display = "none";
    });

    button.addEventListener("click", () => {
      alert("Website design is ready. AI prediction will be connected in the next step.");
    });
  </script>
</body>
</html>
